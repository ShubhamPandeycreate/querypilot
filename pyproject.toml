[project]
name = "querypilot"
version = "0.1.0"
description = "A data-analyst agent over SQL databases: schema exploration, guarded SQL execution, self-correction, and charts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shubham Pandey" }]
dependencies = [
    "openai>=1.50",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    "sqlglot>=25.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbagent", "evals"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# evals/ is a first-party package but lives outside src/, so isort would
# otherwise sort `from evals...` into the third-party block and fail CI.
known-first-party = ["dbagent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["dbagent"]
ignore_missing_imports = true
